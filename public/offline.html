<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#10b981" />
    <title>Offline · BucketFund</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0f172a;
        --muted: #475569;
        --accent: #10b981;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0f14;
          --fg: #f1f5f9;
          --muted: #94a3b8;
        }
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
        gap: 1rem;
      }
      h1 { margin: 0; font-size: 1.75rem; font-weight: 600; }
      p  { margin: 0; max-width: 28rem; color: var(--muted); }
      button {
        margin-top: 1rem;
        padding: 0.75rem 1.25rem;
        font: inherit;
        font-weight: 600;
        color: white;
        background: var(--accent);
        border: 0;
        border-radius: 9999px;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        BucketFund needs a connection to sync with your bank and family.
        Your last-seen balances may still be visible in the app.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
