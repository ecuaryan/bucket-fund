<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>Offline · Bucket My Money</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #000000;
        --fg: #d4d4d8;
        --muted: #a1a1aa;
        --accent: #10b981;
      }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
        gap: 1rem;
      }
      .logo {
        width: 48px;
        height: 48px;
        border-radius: 1rem;
      }
      h1 { margin: 0; font-size: 1.75rem; font-weight: 600; color: var(--fg); }
      p  { margin: 0; max-width: 28rem; color: var(--muted); line-height: 1.5; }
      button {
        margin-top: 1rem;
        padding: 0.75rem 1.25rem;
        font: inherit;
        font-weight: 600;
        color: #000000;
        background: var(--accent);
        border: 0;
        border-radius: 9999px;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/icons/icon-192.png" width="48" height="48" alt="" />
      <h1>You're offline</h1>
      <!-- Keep in sync with OFFLINE_PAGE_BODY in src/lib/brand.ts -->
      <p>
        Bucket My Money needs a connection to sync with your bank and household. Your last-seen balances may still be visible in the app.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
