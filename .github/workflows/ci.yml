name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: lint, unit test, build
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Log build version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Built ${VERSION} (${GITHUB_SHA:0:7})"

  db:
    name: database RLS tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Install dependencies
        run: npm ci

      - name: Start Supabase
        run: supabase start

      - name: Database RLS tests
        run: npm run test:db
        env:
          CI: true
          SKIP_DB_RESET: '1'

  e2e:
    name: e2e smoke tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Install dependencies
        run: npm ci

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Start Supabase
        run: supabase start

      - name: E2E smoke tests
        run: npm run test:e2e
        env:
          CI: true
          SKIP_DB_RESET: '1'
