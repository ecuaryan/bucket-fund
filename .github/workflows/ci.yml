name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changed scope
    runs-on: ubuntu-latest
    outputs:
      run_db: ${{ steps.scope.outputs.run_db }}
      run_e2e: ${{ steps.scope.outputs.run_e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "run_db=true" >> "$GITHUB_OUTPUT"
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE" "$HEAD" | node scripts/ciChangedScope.mjs >> "$GITHUB_OUTPUT"

  unit:
    name: lint, unit test, build
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Log build version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Built ${VERSION} (${GITHUB_SHA:0:7})"

  db:
    name: database RLS tests
    needs: changes
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Skip (no db-relevant files changed)
        if: needs.changes.outputs.run_db == 'false'
        run: echo "Skipping database RLS tests — change set cannot affect Postgres RLS or RPCs."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_db != 'false'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.run_db != 'false'
        with:
          node-version: '22'
          cache: npm

      - uses: supabase/setup-cli@v1
        if: needs.changes.outputs.run_db != 'false'
        with:
          version: 2.101.0

      - name: Install dependencies
        if: needs.changes.outputs.run_db != 'false'
        run: npm ci

      - name: Start Supabase
        if: needs.changes.outputs.run_db != 'false'
        run: supabase start

      - name: Database RLS tests
        if: needs.changes.outputs.run_db != 'false'
        run: npm run test:db
        env:
          CI: true
          SKIP_DB_RESET: '1'

  e2e:
    name: e2e smoke tests
    needs: changes
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Skip (docs-only change)
        if: needs.changes.outputs.run_e2e == 'false'
        run: echo "Skipping e2e smoke tests — docs-only change."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_e2e != 'false'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.run_e2e != 'false'
        with:
          node-version: '22'
          cache: npm

      - uses: supabase/setup-cli@v1
        if: needs.changes.outputs.run_e2e != 'false'
        with:
          version: 2.101.0

      - name: Install dependencies
        if: needs.changes.outputs.run_e2e != 'false'
        run: npm ci

      - uses: actions/cache@v4
        if: needs.changes.outputs.run_e2e != 'false'
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        if: needs.changes.outputs.run_e2e != 'false'
        run: npx playwright install chromium --with-deps

      - name: Start Supabase
        if: needs.changes.outputs.run_e2e != 'false'
        run: supabase start

      - name: E2E smoke tests
        if: needs.changes.outputs.run_e2e != 'false'
        run: npm run test:e2e
        env:
          CI: true
          SKIP_DB_RESET: '1'
